  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#8b5cf6"/><stop offset="0.50" stop-color="#ec4899"/><stop offset="1.00" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#8b5cf6"/><stop offset="0.33" stop-color="#ec4899"/><stop offset="0.67" stop-color="#f97316"/><stop offset="1.00" stop-color="#22d3ee"/></linearGradient>
