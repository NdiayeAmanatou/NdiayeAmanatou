hor="middle">Challenge SALSTIS</text><text x="700" y="190" font-size="12.5" fill="#a49fc2" text-anchor="middle">JOJ Dakar 2026 · Innovation</text></g><g class="it" style="animation-delay:2.20s"><text class="mono" x="900" y="78" font-size="13" font-weight="700" fill="#ec4899" text-anchor="middle">Juil. 2026 →</text><circle cx="900" cy="120" r="20" fill="#ec4899" fill-opacity=".12"/><circle class="live" cx="900" cy="120" r="20" fill="none" stroke="#ec4899" stroke-width="2"/><circle cx="900" cy="120" r="9" fill="#0c0919" stroke="#ec4899" stroke-width="3"/><text x="900" y="168" font-size="16" font-weight="700" fill="#f3f1ff" text-anchor="middle">CPS Référent IA</text><text x="900" y="190" font-size="12.5" fill="#a49fc2" text-anchor="middle">Orange Digital Center</text><rect x="862" y="202" width="76" height="22" rx="11" fill="#34d399" fill-opacity=".15"/><text class="mono" x="900" y="217" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">EN COURS</text></g></g>
