<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250"><style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'Cascadia Code', Consolas, 'SF Mono', Menlo, 'Courier New', monospace} .draw{stroke-dasharray:880;stroke-dashoffset:880;animation:draw 2.6s ease-out .2s forwards}@keyframes draw{to{stroke-dashoffset:0}}
.it{animation:in .7s ease-out both}@keyframes in{from{opacity:0;transform:translateY(16px)}}
.live{transform-box:fill-box;transform-origin:center;animation:p 1.8s infinite}@keyframes p{from{transform:scale(.6);opacity:1}to{transform:scale(1.8);opacity:0}}</style><defs><linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="940" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".25" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#3b82f6"/><stop offset=".75" stop-color="#f97316"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
