<text x="26" y="112" font-size="21" font-weight="800" fill="#f3f1ff">Prédiction de consommation</text><text x="26" y="138" font-size="21" font-weight="800" fill="#f3f1ff">énergétique</text><text x="26" y="168" font-size="13.5" fill="#a49fc2">Réseau de neurones TensorFlow/Keras qui prédit la</text><text x="26" y="188" font-size="13.5" fill="#a49fc2">consommation d'énergie d'un bâtiment intelligent à partir</text><text x="26" y="208" font-size="13.5" fill="#a49fc2">de capteurs IoT.</text><rect x="26" y="220" width="96" height="26" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text class="mono" x="37" y="238" font-size="12" fill="#f3f1ff">TensorFlow</text><rect x="130" y="220" width="59" height="26" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text class="mono" x="141" y="238" font-size="12" fill="#f3f1ff">Keras</text><rect x="198" y="220" width="44" height="26" rx="8" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text class="mono" x="209" y="238" font-size="12" fill="#f3f1ff">IoT</text></g>
