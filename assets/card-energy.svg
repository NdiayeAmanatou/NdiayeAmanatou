<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'Cascadia Code', Consolas, 'SF Mono', Menlo, 'Courier New', monospace} .gl{transform-box:fill-box;transform-origin:center;animation:gl 5s ease-in-out infinite}@keyframes gl{50%{transform:scale(1.25);opacity:.7}}
.ar{animation:ar 1.8s ease-in-out infinite}@keyframes ar{50%{transform:translateX(4px)}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0.00" stop-color="#8b5cf6"/><stop offset="1.00" stop-color="#ec4899"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<clipPath id="win"><rect width="480" height="270" rx="20"/></clipPath></defs>
<g clip-path="url(#win)"><rect width="480" height="270" fill="#0f0b1e"/>
