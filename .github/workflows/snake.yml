# Génère l'animation du serpent qui mange la grille de contributions
name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12 h
  workflow_dispatch:          # bouton "Run workflow"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#ec4899&color_dots=#ebedf0,#e9d5ff,#c4b5fd,#a78bfa,#8b5cf6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ec4899&color_dots=#161b22,#3b1f5e,#6d28d9,#a855f7,#f472b6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
